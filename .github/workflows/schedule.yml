name: F1 schedule

on:
  schedule:
    # Израиль летом UTC+3, зимой UTC+2, поэтому ловим оба варианта:
    # 03-05 UTC — понедельничный анонс (06:00 IL), 16-18 UTC — напоминание (19:00 IL).
    # Лишние запуски безвредны: бот сам решает, наступил ли момент.
    - cron: '0 3,4,5,16,17,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что сделать'
        type: choice
        default: dry-run
        options:
          - dry-run   # показать в логе, что бот сделал бы сейчас
          - check     # проверить доступ к группе и право на закреп
          - send      # обычный боевой запуск

permissions:
  contents: write

concurrency:
  group: f1-schedule
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install --quiet tzdata

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            check)   python bot.py --check ;;
            dry-run) python bot.py --dry-run ;;
            *)       python bot.py ;;
          esac

      - name: Save state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name  'f1-drocheduler'
            git config user.email 'actions@github.com'
            git add state.json
            git commit -m 'state: отмечены отправленные сообщения'
            git push
          fi
