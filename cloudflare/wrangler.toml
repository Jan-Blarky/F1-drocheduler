name = "f1-drocheduler-trigger"
main = "worker.js"
compatibility_date = "2026-01-01"

[triggers]
# 06:00 и 19:00 по Израилю. Часов по два на каждое время, потому что Израиль
# летом UTC+3, а зимой UTC+2; лишний запуск бот отработает вхолостую сам.
# Одно выражение вместо четырёх триггеров — так не упираемся в их лимит.
crons = ["0 3,4,16,17 * * *"]
